<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>WebPilot Agent – AI-Powered Browser Assistant</title>
    <style>
        body {
            width: 300px;
            padding: 15px;
            font-family: 'Consolas', 'Monaco', monospace;
            background: #0a0a0a;
            color: #ffffff;
            margin: 0;
        }

        h1 {
            font-size: 18px;
            margin: 0 0 15px 0;
            font-weight: normal;
            letter-spacing: 1px;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
            padding: 10px;
            background: #1a1a1a;
            border-radius: 4px;
        }

        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #666;
        }

        .status-dot.connected {
            background: #00ff00;
            box-shadow: 0 0 10px #00ff00;
        }

        button {
            width: 100%;
            padding: 10px;
            background: #ffffff;
            color: #0a0a0a;
            border: none;
            cursor: pointer;
            font-family: inherit;
            font-size: 14px;
            font-weight: bold;
            border-radius: 4px;
            margin-bottom: 10px;
        }

        button:hover {
            background: #e0e0e0;
        }

        button:disabled {
            background: #333;
            color: #666;
            cursor: not-allowed;
        }

        .info {
            font-size: 12px;
            color: #666;
            margin-top: 10px;
            line-height: 1.5;
        }

        .link {
            color: #00aaff;
            text-decoration: none;
        }

        .link:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <h1>WebPilot Agent – AI-Powered Browser Assistant</h1>

    <div class="status">
        <div class="status-dot" id="statusDot"></div>
        <span id="statusText">Connecting...</span>
    </div>

    <button id="connectBtn">Connect to Backend</button>
    <button id="disconnectBtn" style="display: none;">Disconnect</button>

    <div class="info">
        Open the <a href="http://localhost:8000" target="_blank" class="link">frontend</a> to control your browser with
        AI.
    </div>

    <script src="popup.js"></script>
</body>

</html>
