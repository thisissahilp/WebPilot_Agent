<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebPilot Agent – AI-Powered Browser Assistant - Visual Agent</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>

<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>WebPilot Agent – AI-Powered Browser Assistant</h1>
            <div class="status-indicator">
                <span class="status-dot" id="statusDot"></span>
                <span id="statusText">Idle</span>
            </div>
        </div>

        <!-- Agent Controls -->
        <div class="controls" id="controls" style="display: none;">
            <button id="pauseBtn" class="control-btn">⏸ Pause</button>
            <button id="resumeBtn" class="control-btn" style="display: none;">▶ Resume</button>
            <button id="timelineBtn" class="control-btn">📊 Timeline</button>
        </div>

        <!-- Timeline View (hidden by default) -->
        <div class="timeline-container" id="timelineContainer" style="display: none;">
            <div class="timeline-header">
                <h3>Action Timeline</h3>
                <button id="closeTimelineBtn" class="close-btn">✕</button>
            </div>
            <div class="timeline" id="timeline"></div>
        </div>

        <!-- Chat Messages -->
        <div class="chat-container" id="chatContainer">
            <div class="welcome-message">
                <h2>👋 Welcome to WebPilot Agent – AI-Powered Browser Assistant</h2>
                <p>Tell me what you want to do, and I'll handle it for you.</p>
                <p class="hint">Example: "Search for AI agents on Google"</p>
            </div>
        </div>

        <!-- Input Area -->
        <div class="input-container">
            <input type="text" id="messageInput" placeholder="Type your task here..." autocomplete="off">
            <button id="sendBtn">Send</button>
        </div>
    </div>

    <script src="/static/app.js"></script>
</body>

</html>
